name: YouTube integration offline tests

on:
  push:
    branches:
      - feature/6-48-update-checker-button
    paths:
      - "FDMX_v6_48.py"
      - "tests/test_youtube_integration_regressions.py"
      - ".github/workflows/youtube-integration-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "FDMX_v6_48.py"
      - "tests/test_youtube_integration_regressions.py"
      - ".github/workflows/youtube-integration-tests.yml"

permissions:
  contents: read

jobs:
  youtube-offline-regressions:
    name: Compile and run offline YouTube regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile v6.48 source
        run: python -m py_compile FDMX_v6_48.py

      - name: Run offline YouTube integration tests
        run: python -m unittest discover -s tests -p "test_youtube_integration_regressions.py" -v
