name: Build GNS Downloader v5.9 for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller pillow

      - name: Create Windows application icon
        shell: pwsh
        run: |
          @'
          from PIL import Image, ImageDraw, ImageFont
          image = Image.new("RGBA", (256, 256), (3, 3, 3, 255))
          draw = ImageDraw.Draw(image)
          draw.rounded_rectangle((8, 8, 248, 248), radius=48, fill=(8, 8, 8, 255), outline=(90, 90, 90, 180), width=2)
          try:
              font = ImageFont.truetype("arialbd.ttf", 184)
          except OSError:
              font = ImageFont.load_default()
          box = draw.textbbox((0, 0), "G", font=font, stroke_width=1)
          x = (256 - (box[2] - box[0])) / 2 - box[0]
          y = (256 - (box[3] - box[1])) / 2 - box[1] - 5
          draw.text((x + 3, y + 5), "G", font=font, fill=(50, 0, 18, 255), stroke_width=3, stroke_fill=(70, 0, 24, 255))
          draw.text((x, y), "G", font=font, fill=(190, 12, 68, 255), stroke_width=1, stroke_fill=(255, 145, 180, 255))
          image.save("gns.ico", format="ICO", sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])
          '@ | Set-Content -Encoding utf8 create_icon.py
          python create_icon.py

      - name: Build standalone executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name GNS-Downloader --icon gns.ico --collect-all PySide6 FDMX_v5_9.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: GNS-Downloader-Windows-v5.9
          path: dist/GNS-Downloader.exe
          if-no-files-found: error
