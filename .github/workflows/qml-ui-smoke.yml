name: Qt Quick QML preview smoke

on:
  push:
    branches: ["**"]
    paths:
      - "qml_ui/**"
      - "tests/test_qml_shell.py"
      - ".github/workflows/qml-ui-smoke.yml"
  pull_request:
    paths:
      - "qml_ui/**"
      - "tests/test_qml_shell.py"
      - ".github/workflows/qml-ui-smoke.yml"
  workflow_dispatch:

jobs:
  qml-smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt Quick runtime and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials pytest
      - name: Compile Python bridge
        run: python -m py_compile qml_ui/main.py
      - name: Run QML structure and runtime smoke tests
        run: python -m pytest -q tests/test_qml_shell.py
