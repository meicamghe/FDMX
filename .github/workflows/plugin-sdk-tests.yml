name: Plugin SDK tests

on:
  push:
    branches:
      - feature/fdmx-6.22-advanced-fingerprinting
  pull_request:
    branches:
      - feature/fdmx-6.22-advanced-fingerprinting
  workflow_dispatch:

jobs:
  plugin-sdk:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install GUI dependency required by Plugin Manager
        run: python -m pip install --upgrade pip PySide6 cryptography
      - name: Compile plugin modules
        run: python -m py_compile fdmx_plugin_sdk.py fdmx_plugin_host.py tests/test_plugin_sdk.py
      - name: Run plugin SDK integration tests
        run: python -m unittest discover -s tests -v
