name: Build GNS Downloader browser extensions 1.3.0
on:
  workflow_dispatch:
  push:
    paths:
      - "browser-extensions/**"
      - ".github/workflows/build-browser-extensions.yml"
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG icon renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Build matching GNS Downloader icons
        run: |
          for browser in chrome firefox; do
            mkdir -p "browser-extensions/$browser/icons"
            for size in 16 32 48 128; do
              rsvg-convert -w "$size" -h "$size" \
                "browser-extensions/$browser/icons/gns-downloader.svg" \
                -o "browser-extensions/$browser/icons/gns-downloader-$size.png"
            done
          done
      - name: Validate extension scripts and manifests
        run: |
          python -m py_compile FDMX_v6_50.py
          python -m unittest discover -s tests -p "test_browser_media_handoff.py" -v
          node --check browser-extensions/chrome/github-auth.js
          node --check browser-extensions/chrome/background.js
          node --check browser-extensions/chrome/popup.js
          node --check browser-extensions/chrome/media-detect.js
          node --check browser-extensions/firefox/github-auth.js
          node --check browser-extensions/firefox/background.js
          node --check browser-extensions/firefox/popup.js
          node --check browser-extensions/firefox/media-detect.js
          python - <<'PY'
          import json
          from pathlib import Path
          for browser in ("chrome", "firefox"):
              root = Path("browser-extensions") / browser
              manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
              assert manifest["name"] == "GNS Downloader"
              assert manifest["version"] == "1.3.0"
              assert "downloads" in manifest["permissions"]
              assert "notifications" in manifest["permissions"]
              for size in (16, 32, 48, 128):
                  assert (root / "icons" / f"gns-downloader-{size}.png").is_file()
          PY
      - name: Package Chrome extension 1.3.0
        run: cd browser-extensions/chrome && zip -r ../../GNS-Downloader-Chrome-1.3.0.zip .
      - name: Package Firefox extension 1.3.0
        run: cd browser-extensions/firefox && zip -r ../../GNS-Downloader-Firefox-1.3.0.xpi .
      - uses: actions/upload-artifact@v4
        with:
          name: GNS-Downloader-browser-extensions-1.3.0
          path: |
            GNS-Downloader-Chrome-1.3.0.zip
            GNS-Downloader-Firefox-1.3.0.xpi
