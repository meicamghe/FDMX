name: Plugin SDK tests

on:
  push:
    branches:
      - feature/fdmx-6.22-advanced-fingerprinting
    paths:
      - "fdmx_plugin_sdk.py"
      - "fdmx_plugin_host.py"
      - "tests/**"
      - ".github/workflows/test-plugin-sdk.yml"
  pull_request:
    paths:
      - "fdmx_plugin_sdk.py"
      - "fdmx_plugin_host.py"
      - "tests/**"
      - ".github/workflows/test-plugin-sdk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-sdk:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install Qt dependency
        run: python -m pip install --upgrade pip PySide6
      - name: Compile SDK and tests
        run: python -m py_compile fdmx_plugin_sdk.py fdmx_plugin_host.py tests/test_plugin_sdk.py
      - name: Run plugin SDK tests
        run: python -m unittest discover -s tests -v
