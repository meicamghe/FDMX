name: Build FDMX Windows packages

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fdmx-6.22-advanced-fingerprinting
    paths:
      - "FDMX_v6_36.py"
      - "fdmx_plugin_*.py"
      - "installer/**"
      - ".github/workflows/build-fdmx-windows.yml"

permissions:
  contents: read

jobs:
  package-windows:
    name: Build Windows EXE and Setup
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 cryptography pyinstaller

      - name: Compile application and plugin modules
        run: |
          python -m py_compile FDMX_v6_36.py fdmx_plugin_sdk.py fdmx_plugin_host.py fdmx_plugin_repository.py

      - name: Build standalone plugin worker
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name fdmx_plugin_worker --distpath dist --workpath build/worker fdmx_plugin_host.py

      - name: Smoke-test packaged plugin worker
        run: |
          python tests/smoke_plugin_worker.py dist/fdmx_plugin_worker.exe

      - name: Build standalone FDMX application
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name FDMX --distpath dist --workpath build/app --collect-all PySide6 --collect-all cryptography FDMX_v6_36.py

      - name: Verify package inputs
        shell: pwsh
        run: |
          $required = @("dist/FDMX.exe", "dist/fdmx_plugin_worker.exe")
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required build output is missing: $file" }
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $compiler = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "installer/FDMX.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/FDMX.exe", "dist/fdmx_plugin_worker.exe" -DestinationPath "dist/FDMX-Portable-v6.36-Windows-x64.zip" -Force

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: FDMX-Windows-v6.36
          path: |
            dist/FDMX.exe
            dist/fdmx_plugin_worker.exe
            dist/FDMX-Portable-v6.36-Windows-x64.zip
            dist/installer/FDMX-Setup-6.36.exe
          if-no-files-found: error
          retention-days: 14
