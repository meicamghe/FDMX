name: Build FDMX Windows packages

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fdmx-6.22-advanced-fingerprinting
    paths:
      - "FDMX_v6_36.py"
      - "fdmx_plugin_*.py"
      - "installer/**"
      - ".github/workflows/build-fdmx-windows.yml"

permissions:
  contents: read

jobs:
  package-windows:
    name: Build optimized Windows EXE and Setup
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 cryptography pyinstaller

      - name: Compile application and plugin modules
        run: |
          python -m py_compile FDMX_v6_36.py fdmx_plugin_sdk.py fdmx_plugin_host.py fdmx_plugin_repository.py

      - name: Build standalone plugin worker
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name fdmx_plugin_worker --distpath dist --workpath build/worker --exclude-module PySide6 fdmx_plugin_host.py

      - name: Smoke-test packaged plugin worker
        run: |
          python tests/smoke_plugin_worker.py dist/fdmx_plugin_worker.exe

      - name: Build lean FDMX application
        shell: pwsh
        run: |
          $excluded = @(
            "PySide6.Qt3DAnimation",
            "PySide6.Qt3DCore",
            "PySide6.Qt3DExtras",
            "PySide6.Qt3DInput",
            "PySide6.Qt3DLogic",
            "PySide6.Qt3DRender",
            "PySide6.QtBluetooth",
            "PySide6.QtCharts",
            "PySide6.QtDataVisualization",
            "PySide6.QtDesigner",
            "PySide6.QtGraphs",
            "PySide6.QtGraphsWidgets",
            "PySide6.QtLocation",
            "PySide6.QtMultimedia",
            "PySide6.QtMultimediaWidgets",
            "PySide6.QtNfc",
            "PySide6.QtPdf",
            "PySide6.QtPdfWidgets",
            "PySide6.QtPositioning",
            "PySide6.QtQml",
            "PySide6.QtQuick",
            "PySide6.QtQuick3D",
            "PySide6.QtQuickControls2",
            "PySide6.QtQuickWidgets",
            "PySide6.QtRemoteObjects",
            "PySide6.QtScxml",
            "PySide6.QtSensors",
            "PySide6.QtSerialBus",
            "PySide6.QtSerialPort",
            "PySide6.QtSpatialAudio",
            "PySide6.QtStateMachine",
            "PySide6.QtTextToSpeech",
            "PySide6.QtWebChannel",
            "PySide6.QtWebEngineCore",
            "PySide6.QtWebEngineQuick",
            "PySide6.QtWebEngineWidgets",
            "PySide6.QtWebSockets",
            "PySide6.QtWebView"
          )
          $args = @(
            "--noconfirm", "--clean", "--onefile", "--windowed",
            "--name", "FDMX", "--distpath", "dist", "--workpath", "build/app",
            "--exclude-module", "PySide6.scripts",
            "--exclude-module", "PySide6.support"
          )
          foreach ($module in $excluded) {
            $args += @("--exclude-module", $module)
          }
          $args += "FDMX_v6_36.py"
          & pyinstaller @args
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE" }

      - name: Verify package inputs and report sizes
        shell: pwsh
        run: |
          $required = @("dist/FDMX.exe", "dist/fdmx_plugin_worker.exe")
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required build output is missing: $file" }
          }
          Get-Item $required | Select-Object Name, Length
          $appBytes = (Get-Item "dist/FDMX.exe").Length
          $workerBytes = (Get-Item "dist/fdmx_plugin_worker.exe").Length
          "FDMX_EXE_MB=$([math]::Round($appBytes / 1MB, 2))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "PLUGIN_WORKER_MB=$([math]::Round($workerBytes / 1MB, 2))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "installer/FDMX.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/FDMX.exe", "dist/fdmx_plugin_worker.exe" -DestinationPath "dist/FDMX-Portable-v6.36-Windows-x64.zip" -Force

      - name: Report final package sizes
        shell: pwsh
        run: |
          Get-Item "dist/FDMX.exe", "dist/fdmx_plugin_worker.exe", "dist/installer/FDMX-Setup-6.36.exe", "dist/FDMX-Portable-v6.36-Windows-x64.zip" |
            Select-Object Name, @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}}

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: FDMX-Windows-v6.36-optimized
          path: |
            dist/FDMX-Portable-v6.36-Windows-x64.zip
            dist/installer/FDMX-Setup-6.36.exe
          if-no-files-found: error
          retention-days: 14
