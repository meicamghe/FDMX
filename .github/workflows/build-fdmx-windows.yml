name: Build GNS Downloader Windows packages

on:
  push:
    branches:
      - feature/fdmx-6.22-advanced-fingerprinting
      - feature/fdmx-6.40-github-updater-ubuntu-theme
      - fix/http-download-compatibility
    tags:
      - "v6.40"
    paths:
      - "FDMX_v6_36.py"
      - "ubuntu.py"
      - "README.md"
      - "docs/README_FA.md"
      - "fdmx_plugin_*.py"
      - "installer/**"
      - "tests/**"
      - ".github/workflows/build-fdmx-windows.yml"

permissions:
  contents: write

jobs:
  package-windows:
    name: Build compact GNS Downloader EXE and Setup
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install minimal build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials cryptography pyinstaller Pillow

      - name: Generate red G application icon
        run: |
          python installer/create_icon.py

      - name: Compile application
        run: |
          python -m py_compile FDMX_v6_36.py ubuntu.py

      - name: Run application regression tests
        run: |
          python tests/test_gns_downloader_regressions.py

      - name: Verify generated icon
        shell: pwsh
        run: |
          if (-not (Test-Path "installer/gns-downloader.ico")) { throw "GNS Downloader icon was not generated." }

      - name: Build GNS Downloader as an onedir application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "GNS Downloader" --icon installer/gns-downloader.ico --distpath dist --workpath build/app --contents-directory _internal FDMX_v6_36.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE" }

      - name: Verify package inputs and report sizes
        shell: pwsh
        run: |
          $app = "dist/GNS Downloader/GNS Downloader.exe"
          if (-not (Test-Path $app)) { throw "Required build output is missing: $app" }
          $appBytes = (Get-ChildItem "dist/GNS Downloader" -File -Recurse | Measure-Object -Property Length -Sum).Sum
          "GNS_DOWNLOADER_DIRECTORY_MB=$([math]::Round($appBytes / 1MB, 2))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem "dist/GNS Downloader" -File -Recurse | Sort-Object Length -Descending | Select-Object -First 15 FullName, Length

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile compressed Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "installer/FDMX.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Install and launch-test the packaged application
        shell: pwsh
        timeout-minutes: 5
        run: |
          $setup = (Resolve-Path "dist/installer/GNS-Downloader-Setup-6.40.exe").Path
          $installDir = Join-Path $env:ProgramFiles "GNS Downloader"
          $installer = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Silent installer failed with exit code $($installer.ExitCode)" }
          $app = Join-Path $installDir "GNS Downloader.exe"
          if (-not (Test-Path $app)) { throw "Installed application not found: $app" }
          $started = Get-Date
          $process = Start-Process -FilePath $app -PassThru
          $ready = $false
          for ($i = 0; $i -lt 35; $i++) {
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) { throw "Installed GNS Downloader exited during startup (exit code $($process.ExitCode))" }
            if ($process.MainWindowHandle -ne 0) { $ready = $true; break }
          }
          if (-not $ready) { throw "GNS Downloader did not create its main window within 35 seconds" }
          Write-Host "Installed GNS Downloader window ready in $([math]::Round(((Get-Date)-$started).TotalSeconds,1)) seconds."
          Stop-Process -Id $process.Id -Force

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/GNS Downloader/*" -DestinationPath "dist/GNS-Downloader-Portable-v6.40-Windows-x64.zip" -Force

      - name: Prepare stable GitHub Release asset names
        shell: pwsh
        run: |
          Copy-Item "dist/installer/GNS-Downloader-Setup-6.40.exe" "dist/installer/GNS-Downloader-Setup.exe"
          Copy-Item "dist/GNS-Downloader-Portable-v6.40-Windows-x64.zip" "dist/GNS-Downloader-Portable-Windows-x64.zip"

      - name: Report final package sizes
        shell: pwsh
        run: |
          Get-Item "dist/installer/GNS-Downloader-Setup-6.40.exe", "dist/GNS-Downloader-Portable-v6.40-Windows-x64.zip" |
            Select-Object Name, @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}}

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: GNS-Downloader-Portable-v6.40
          path: dist/GNS-Downloader-Portable-v6.40-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer Setup
        uses: actions/upload-artifact@v7
        with:
          name: GNS-Downloader-Setup-v6.40
          path: dist/installer/GNS-Downloader-Setup-6.40.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish permanent GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: GNS Downloader ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/GNS-Downloader-Portable-Windows-x64.zip
            dist/installer/GNS-Downloader-Setup.exe
          fail_on_unmatched_files: true
          make_latest: true

  test-linux-ubuntu-theme:
    name: Test Linux source and Ubuntu Yaru appearance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install PySide6
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials

      - name: Compile source and run regression tests
        run: |
          python -m py_compile FDMX_v6_36.py ubuntu.py
          python tests/test_gns_downloader_regressions.py

      - name: Launch app and verify Ubuntu Yaru theme
        run: |
          python - <<'PY'
          import runpy
          import sys
          from PySide6.QtCore import QTimer
          from PySide6.QtWidgets import QApplication

          original_exec = QApplication.exec
          original_exit = sys.exit

          def timed_exec():
              QTimer.singleShot(1800, QApplication.instance().quit)
              return original_exec()

          QApplication.exec = staticmethod(timed_exec)
          sys.exit = lambda *args, **kwargs: None
          try:
              namespace = runpy.run_path("FDMX_v6_36.py", run_name="__main__")
              app = QApplication.instance()
              window = namespace["window"]
              assert window.theme_combo.currentData() == "ubuntu_yaru"
              assert "#e95420" in app.styleSheet().lower()
              print("Ubuntu Yaru startup smoke test passed.")
          finally:
              sys.exit = original_exit
              QApplication.exec = staticmethod(original_exec)
          PY
