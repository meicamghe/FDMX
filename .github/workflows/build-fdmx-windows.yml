name: Build GNS Downloader Windows packages

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fdmx-6.22-advanced-fingerprinting
    paths:
      - "FDMX_v6_36.py"
      - "fdmx_plugin_*.py"
      - "installer/**"
      - ".github/workflows/build-fdmx-windows.yml"

permissions:
  contents: read

jobs:
  package-windows:
    name: Build compact GNS Downloader EXE and Setup
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials cryptography pyinstaller Pillow

      - name: Generate red G application icon
        run: |
          python installer/create_icon.py

      - name: Compile application
        run: |
          python -m py_compile FDMX_v6_36.py

      - name: Run application regression tests
        run: |
          python tests/test_gns_downloader_regressions.py

      - name: Verify generated icon
        shell: pwsh
        run: |
          if (-not (Test-Path "installer/gns-downloader.ico")) { throw "GNS Downloader icon was not generated." }

      - name: Build GNS Downloader as an onedir application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "GNS Downloader" --icon installer/gns-downloader.ico --distpath dist --workpath build/app --contents-directory _internal FDMX_v6_36.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE" }

      - name: Verify package inputs and report sizes
        shell: pwsh
        run: |
          $app = "dist/GNS Downloader/GNS Downloader.exe"
          if (-not (Test-Path $app)) { throw "Required build output is missing: $app" }
          $appBytes = (Get-ChildItem "dist/GNS Downloader" -File -Recurse | Measure-Object -Property Length -Sum).Sum
          "GNS_DOWNLOADER_DIRECTORY_MB=$([math]::Round($appBytes / 1MB, 2))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem "dist/GNS Downloader" -File -Recurse | Sort-Object Length -Descending | Select-Object -First 15 FullName, Length

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile compressed Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "installer/FDMX.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Install and launch-test the packaged application
        shell: pwsh
        timeout-minutes: 5
        run: |
          $setup = (Resolve-Path "dist/installer/GNS-Downloader-Setup-6.38.exe").Path
          $installDir = Join-Path $env:ProgramFiles "GNS Downloader"
          $installer = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Silent installer failed with exit code $($installer.ExitCode)" }
          $app = Join-Path $installDir "GNS Downloader.exe"
          if (-not (Test-Path $app)) { throw "Installed application not found: $app" }
          $started = Get-Date
          $process = Start-Process -FilePath $app -PassThru
          $ready = $false
          for ($i = 0; $i -lt 35; $i++) {
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) { throw "Installed GNS Downloader exited during startup (exit code $($process.ExitCode))" }
            if ($process.MainWindowHandle -ne 0) { $ready = $true; break }
          }
          if (-not $ready) { throw "GNS Downloader did not create its main window within 35 seconds" }
          Write-Host "Installed GNS Downloader window ready in $([math]::Round(((Get-Date)-$started).TotalSeconds,1)) seconds."
          Stop-Process -Id $process.Id -Force

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/GNS Downloader/*" -DestinationPath "dist/GNS-Downloader-Portable-v6.38-Windows-x64.zip" -Force

      - name: Report final package sizes
        shell: pwsh
        run: |
          Get-Item "dist/installer/GNS-Downloader-Setup-6.38.exe", "dist/GNS-Downloader-Portable-v6.38-Windows-x64.zip" |
            Select-Object Name, @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}}

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GNS-Downloader-Portable-v6.38
          path: dist/GNS-Downloader-Portable-v6.38-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer Setup
        uses: actions/upload-artifact@v4
        with:
          name: GNS-Downloader-Setup-v6.38
          path: dist/installer/GNS-Downloader-Setup-6.38.exe
          if-no-files-found: error
          retention-days: 14
