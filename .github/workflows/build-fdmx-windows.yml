name: Build FDMX Windows packages

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fdmx-6.22-advanced-fingerprinting
    paths:
      - "FDMX_v6_36.py"
      - "fdmx_plugin_*.py"
      - "installer/**"
      - ".github/workflows/build-fdmx-windows.yml"

permissions:
  contents: read

jobs:
  package-windows:
    name: Build compact Windows EXE and Setup
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials cryptography pyinstaller

      - name: Compile application and plugin modules
        run: |
          python -m py_compile FDMX_v6_36.py fdmx_plugin_sdk.py fdmx_plugin_host.py fdmx_plugin_repository.py

      - name: Build standalone plugin worker
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name fdmx_plugin_worker --distpath dist --workpath build/worker --exclude-module PySide6 fdmx_plugin_host.py

      - name: Smoke-test packaged plugin worker
        run: |
          python tests/smoke_plugin_worker.py dist/fdmx_plugin_worker.exe

      - name: Build FDMX as an onedir application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name FDMX --distpath dist --workpath build/app --contents-directory _internal FDMX_v6_36.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE" }

      - name: Verify package inputs and report sizes
        shell: pwsh
        run: |
          $app = "dist/FDMX/FDMX.exe"
          $worker = "dist/fdmx_plugin_worker.exe"
          if (-not (Test-Path $app)) { throw "Required build output is missing: $app" }
          if (-not (Test-Path $worker)) { throw "Required build output is missing: $worker" }
          $appBytes = (Get-ChildItem "dist/FDMX" -File -Recurse | Measure-Object -Property Length -Sum).Sum
          $workerBytes = (Get-Item $worker).Length
          "FDMX_DIRECTORY_MB=$([math]::Round($appBytes / 1MB, 2))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "PLUGIN_WORKER_MB=$([math]::Round($workerBytes / 1MB, 2))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem "dist/FDMX" -File -Recurse | Sort-Object Length -Descending | Select-Object -First 15 FullName, Length

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile compressed Windows installer
        shell: pwsh
        run: |
          $compiler = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "installer/FDMX.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/FDMX/*", "dist/fdmx_plugin_worker.exe" -DestinationPath "dist/FDMX-Portable-v6.36-Windows-x64.zip" -Force

      - name: Report final package sizes
        shell: pwsh
        run: |
          Get-Item "dist/installer/FDMX-Setup-6.36.exe", "dist/FDMX-Portable-v6.36-Windows-x64.zip", "dist/fdmx_plugin_worker.exe" |
            Select-Object Name, @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}}

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: FDMX-Windows-v6.36-compact
          path: |
            dist/FDMX-Portable-v6.36-Windows-x64.zip
            dist/installer/FDMX-Setup-6.36.exe
          if-no-files-found: error
          retention-days: 14
