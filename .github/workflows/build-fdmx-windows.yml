name: Build GNS Downloader Windows packages

on:
  push:
    branches:
      - main
      - release/6.54-finalization
      - feature/fdmx-6.22-advanced-fingerprinting
      - feature/fdmx-6.40-github-updater-ubuntu-theme
      - fix/http-download-compatibility
    tags:
      - "v*"
    paths:
      - "FDMX_v6_50.py"
      - "qml_ui/**"
      - "tests/test_youtube_integration_regressions.py"
      - "ubuntu.py"
      - "README.md"
      - "docs/README_FA.md"
      - "fdmx_plugin_*.py"
      - "installer/**"
      - "tests/**"
      - ".github/workflows/build-fdmx-windows.yml"
  pull_request:
    branches:
      - main
      - experiment/qml-ui-shell
    paths:
      - "FDMX_v6_50.py"
      - "qml_ui/**"
      - "ubuntu.py"
      - "README.md"
      - "docs/README_FA.md"
      - "fdmx_plugin_*.py"
      - "installer/**"
      - "tests/**"
      - ".github/workflows/build-fdmx-windows.yml"

permissions:
  contents: write

jobs:
  package-windows:
    name: Build compact GNS Downloader EXE and Setup
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install minimal build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 cryptography certifi pyinstaller Pillow yt-dlp PySocks pytest

      - name: Install UPX binary compressor
        run: |
          choco install upx --yes --no-progress
          upx --version

      - name: Generate red G application icon
        run: |
          python installer/create_icon.py

      - name: Compile application
        run: |
          python -m py_compile FDMX_v6_50.py ubuntu.py

      - name: Run application regression tests
        run: |
          python -m unittest discover -s tests -p "test_youtube_integration_regressions.py" -v
          python -m unittest discover -s tests -p "test_browser_media_handoff.py" -v
          python -m unittest discover -s tests -p "test_auto_start_and_package_size.py" -v
          python -m unittest discover -s tests -p "test_github_artifact_auth_and_sort.py" -v
          python -m pytest -q tests/test_ui_usability_fixes.py

      - name: Verify generated icon
        shell: pwsh
        run: |
          if (-not (Test-Path "installer/gns-downloader.ico")) { throw "GNS Downloader icon was not generated." }

      - name: Build GNS Downloader as an onedir application
        shell: pwsh
        run: |
          upx --version
          pyinstaller --noconfirm --clean --onedir --windowed --name "GNS Downloader" --icon installer/gns-downloader.ico --distpath dist --workpath build/app --contents-directory _internal --collect-all yt_dlp --hidden-import socks FDMX_v6_50.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE" }

      - name: Verify package inputs and report sizes
        shell: pwsh
        run: |
          $app = "dist/GNS Downloader/GNS Downloader.exe"
          if (-not (Test-Path $app)) { throw "Required build output is missing: $app" }
          $appBytes = (Get-ChildItem "dist/GNS Downloader" -File -Recurse | Measure-Object -Property Length -Sum).Sum
          "GNS_DOWNLOADER_DIRECTORY_MB=$([math]::Round($appBytes / 1MB, 2))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem "dist/GNS Downloader" -File -Recurse | Sort-Object Length -Descending | Select-Object -First 15 FullName, Length

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile compressed Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "installer/FDMX.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Install and launch-test the packaged application
        shell: pwsh
        timeout-minutes: 5
        run: |
          $setup = (Resolve-Path "dist/installer/GNS-Downloader-Setup-6.54.exe").Path
          $installDir = Join-Path $env:ProgramFiles "GNS Downloader"
          $installer = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Silent installer failed with exit code $($installer.ExitCode)" }
          $app = Join-Path $installDir "GNS Downloader.exe"
          if (-not (Test-Path $app)) { throw "Installed application not found: $app" }
          $protocol = Get-ItemProperty -Path "Registry::HKEY_CLASSES_ROOT\gnsdownloader" -ErrorAction Stop
          if ($protocol.'URL Protocol' -ne "") { throw "GNS Downloader URL protocol marker is missing." }
          $protocolCommand = (Get-ItemProperty -Path "Registry::HKEY_CLASSES_ROOT\gnsdownloader\shell\open\command").'(default)'
          if ($protocolCommand -notmatch [regex]::Escape($app)) { throw "GNS Downloader URL protocol is not registered to the installed app." }
          $started = Get-Date
          $process = Start-Process -FilePath $app -PassThru
          $ready = $false
          for ($i = 0; $i -lt 35; $i++) {
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) { throw "Installed GNS Downloader exited during startup (exit code $($process.ExitCode))" }
            if ($process.MainWindowHandle -ne 0) { $ready = $true; break }
          }
          if (-not $ready) { throw "GNS Downloader did not create its main window within 35 seconds" }
          Write-Host "Installed GNS Downloader window ready in $([math]::Round(((Get-Date)-$started).TotalSeconds,1)) seconds."
          Stop-Process -Id $process.Id -Force

      - name: Build experimental ADM QML application
        shell: pwsh
        run: |
          $qmlDir = python -c "from PySide6.QtCore import QLibraryInfo; print(QLibraryInfo.path(QLibraryInfo.LibraryPath.QmlImportsPath))"
          if (-not (Test-Path $qmlDir)) { throw "Qt QML runtime directory not found: $qmlDir" }
          # Ship only QML modules imported by Main.qml and their bundled dependencies.
          $qmlStage = Join-Path $env:RUNNER_TEMP "adm-qml-imports"
          New-Item -ItemType Directory -Force -Path $qmlStage | Out-Null
          foreach ($module in @("QtQuick", "QtQml", "Qt")) {
            $source = Join-Path $qmlDir $module
            if (Test-Path $source) { Copy-Item $source -Destination $qmlStage -Recurse -Force }
          }
          pyinstaller --noconfirm --clean --onedir --windowed --name "ADM QML" --icon installer/gns-downloader.ico --distpath dist-qml --workpath build/qml --paths . --hidden-import FDMX_v6_50 --hidden-import PySide6.QtQml --hidden-import PySide6.QtQuick --hidden-import PySide6.QtQuickControls2 --hidden-import PySide6.QtOpenGL --hidden-import PySide6.QtWidgets --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtWebEngineQuick --add-data "$qmlStage;PySide6/Qt/qml" --add-data "qml_ui/Main.qml;qml_ui" qml_ui/production_main.py
          if ($LASTEXITCODE -ne 0) { throw "ADM QML packaging failed with exit code $LASTEXITCODE" }
          # Qt's built-in English strings need no translation catalogs. Drop optional
          # language catalogs and development-only metadata from the preview bundle.
          foreach ($translations in @("dist-qml/ADM QML/_internal/PySide6/translations", "dist-qml/ADM QML/_internal/PySide6/Qt/translations")) {
            if (Test-Path $translations) { Remove-Item $translations -Recurse -Force }
          }
          $qmlApp = "dist-qml/ADM QML/ADM QML.exe"
          if (-not (Test-Path $qmlApp)) { throw "ADM QML executable is missing." }
          & $qmlApp --smoke-test
          $smokeExit = $LASTEXITCODE
          if ($smokeExit -ne 0) { throw "ADM QML startup smoke test failed with exit code $smokeExit" }
          $bundleBytes = (Get-ChildItem "dist-qml/ADM QML" -File -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host "ADM QML optimized onedir size: $([math]::Round($bundleBytes / 1MB, 2)) MiB"
          Get-ChildItem "dist-qml/ADM QML" -File -Recurse | Sort-Object Length -Descending | Select-Object -First 20 FullName, Length
      - name: Create experimental ADM QML portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist-qml/ADM QML/*" -DestinationPath "dist-qml/ADM-QML-Preview-6.54-Windows-x64.zip" -Force
      - name: Compile experimental ADM QML installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "installer/FDMX-QML.iss"
          if ($LASTEXITCODE -ne 0) { throw "ADM QML installer compilation failed with exit code $LASTEXITCODE" }
      - name: Enforce experimental QML package size
        shell: pwsh
        run: |
          $limit = 50MB
          $setup = Get-Item "dist/installer/ADM-QML-Preview-Setup-6.54.exe"
          $portable = Get-Item "dist-qml/ADM-QML-Preview-6.54-Windows-x64.zip"
          foreach ($file in @($setup, $portable)) {
            $sizeMB = [math]::Round($file.Length / 1MB, 2)
            Write-Host "$($file.Name): $sizeMB MiB"
            if ($file.Length -gt $limit) { throw "$($file.Name) exceeds the 50 MiB test-build limit." }
          }
      - name: Upload experimental ADM QML Setup
        uses: actions/upload-artifact@v7
        with:
          name: ADM-QML-Preview-Setup-v6.54
          path: dist/installer/ADM-QML-Preview-Setup-6.54.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload experimental ADM QML Portable
        uses: actions/upload-artifact@v7
        with:
          name: ADM-QML-Preview-Portable-v6.54
          path: dist-qml/ADM-QML-Preview-6.54-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/GNS Downloader/*" -DestinationPath "dist/GNS-Downloader-Portable-v6.54-Windows-x64.zip" -Force

      - name: Prepare stable GitHub Release asset names
        shell: pwsh
        run: |
          Copy-Item "dist/installer/GNS-Downloader-Setup-6.54.exe" "dist/installer/GNS-Downloader-Setup.exe"
          Copy-Item "dist/GNS-Downloader-Portable-v6.54-Windows-x64.zip" "dist/GNS-Downloader-Portable-Windows-x64.zip"

      - name: Enforce the 50 MiB Windows package limit
        shell: pwsh
        run: |
          $limit = 50MB
          $packages = @(
            "dist/installer/GNS-Downloader-Setup-6.54.exe",
            "dist/GNS-Downloader-Portable-v6.54-Windows-x64.zip"
          )
          foreach ($path in $packages) {
            if (-not (Test-Path $path)) { throw "Required package is missing: $path" }
            $file = Get-Item $path
            $sizeMB = [math]::Round($file.Length / 1MB, 2)
            Write-Host "$($file.Name): $sizeMB MiB"
            if ($file.Length -gt $limit) {
              throw "$($file.Name) is $sizeMB MiB; the maximum allowed size is 50 MiB."
            }
          }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: GNS-Downloader-Portable-v6.54
          path: dist/GNS-Downloader-Portable-v6.54-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer Setup
        uses: actions/upload-artifact@v7
        with:
          name: GNS-Downloader-Setup-v6.54
          path: dist/installer/GNS-Downloader-Setup-6.54.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish permanent GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: GNS Downloader ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/GNS-Downloader-Portable-Windows-x64.zip
            dist/installer/GNS-Downloader-Setup.exe
          fail_on_unmatched_files: true
          make_latest: true

  test-linux-ubuntu-theme:
    name: Test Linux source and Ubuntu Yaru appearance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install PySide6
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials yt-dlp PySocks

      - name: Compile source and run regression tests
        run: |
          python -m py_compile FDMX_v6_50.py ubuntu.py
          python -m unittest discover -s tests -p "test_youtube_integration_regressions.py" -v
          python -m unittest discover -s tests -p "test_auto_start_and_package_size.py" -v
          python -m unittest discover -s tests -p "test_github_artifact_auth_and_sort.py" -v

      - name: Launch app and verify Ubuntu Yaru theme
        run: |
          python - <<'PY'
          import runpy
          import sys
          from PySide6.QtCore import QTimer
          from PySide6.QtWidgets import QApplication

          original_exec = QApplication.exec
          original_exit = sys.exit

          def timed_exec():
              QTimer.singleShot(1800, QApplication.instance().quit)
              return original_exec()

          QApplication.exec = staticmethod(timed_exec)
          sys.exit = lambda *args, **kwargs: None
          try:
              namespace = runpy.run_path("FDMX_v6_50.py", run_name="__main__")
              app = QApplication.instance()
              window = namespace["window"]
              assert window.theme_combo.currentData() == "ubuntu_yaru"
              assert "#e95420" in app.styleSheet().lower()
              print("Ubuntu Yaru startup smoke test passed.")
          finally:
              sys.exit = original_exit
              QApplication.exec = staticmethod(original_exec)
          PY
